# Example only — do not put real passwords in git.
# Create the live Secret with:
#   oc create secret generic hermes-dashboard-auth -n remediation-pov \
#     --from-literal=HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin \
#     --from-literal=HERMES_DASHBOARD_BASIC_AUTH_PASSWORD='<password>' \
#     --from-literal=HERMES_DASHBOARD_BASIC_AUTH_SECRET='<random-32+-chars>' \
#     --from-literal=OPENAI_API_KEY=not-needed \
#     --from-literal=OPENAI_BASE_URL=http://qwen36-27b-openai.remediation-pov.svc.cluster.local/v1
#
# Or: oc apply -f lab/hermes/secret.example.yaml after replacing placeholders.
---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-dashboard-auth
  namespace: remediation-pov
  labels:
    app: hermes-agent
    app.kubernetes.io/part-of: remediation-pov
type: Opaque
stringData:
  HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "<SET_HERMES_DASHBOARD_PASSWORD>"
  HERMES_DASHBOARD_SECRET: "<SET_HERMES_DASHBOARD_SECRET_32CHARS_MIN>"
  HERMES_DASHBOARD_BASIC_AUTH_SECRET: "<SET_HERMES_DASHBOARD_SECRET_32CHARS_MIN>"
  OPENAI_API_KEY: "not-needed"
  OPENAI_BASE_URL: "http://qwen36-27b-openai.remediation-pov.svc.cluster.local/v1"
