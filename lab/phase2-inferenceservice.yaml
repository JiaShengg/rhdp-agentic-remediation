# Phase 2: single-model vLLM on the 1x L4 (24GB)
# Model: Qwen2.5-Coder-7B-Instruct (fits L4; served-model-name stays qwen25-7b)
# Upgrade path later: POV Qwen3.6-27B / 128K on L40S/A100-class
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen25-7b
  namespace: remediation-pov
  annotations:
    openshift.io/display-name: Qwen2.5-Coder-7B-Instruct (lab)
    serving.kserve.io/deploymentMode: RawDeployment
    security.opendatahub.io/enable-auth: "false"  # lab-only; set true if exposing a Route
  labels:
    opendatahub.io/dashboard: "true"
    app.kubernetes.io/part-of: remediation-pov
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-cuda-runtime
      # Weights pre-downloaded by Job download-qwen25-7b onto this PVC
      storageUri: pvc://qwen25-7b-model/
      args:
        - --max-model-len=16384
        - --gpu-memory-utilization=0.92
        - --dtype=auto
        - --enable-auto-tool-choice
        - --tool-call-parser=hermes
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "14"
          memory: 48Gi
          nvidia.com/gpu: "1"

# Weights come from Job download-qwen25-coder-7b onto pvc://qwen25-7b-model/.
# Hermes keeps model id qwen25-7b (KServe --served-model-name). Record dry-run in phase6 primer.
# Coder often emits markdown JSON tool stubs under tool_choice=auto — see
# lab/hermes/patch_coder_tool_json.py (bootstrap promote patch).
