apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stub-audit
  namespace: remediation-pov
  labels:
    app.kubernetes.io/part-of: remediation-pov
    app.kubernetes.io/name: stub-findings-mcp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: gp3-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stub-findings-mcp
  namespace: remediation-pov
  labels:
    app: stub-findings-mcp
    app.kubernetes.io/part-of: remediation-pov
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stub-findings-mcp
  template:
    metadata:
      labels:
        app: stub-findings-mcp
        app.kubernetes.io/part-of: remediation-pov
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: stub
          image: registry.access.redhat.com/ubi9/python-311:latest@sha256:7b6cb58d3ff034df7b300800bd89a469d9bd2f739d43250d76b9c9e805307ab5
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              pip install -q "fastapi==0.115.5" "uvicorn[standard]==0.32.1"
              exec python /app/app.py
          env:
            - name: FINDINGS_PATH
              value: /data/findings.json
            - name: BASELINES_PATH
              value: /data/baselines.json
            - name: DECISIONS_PATH
              value: /decisions/decisions.jsonl
            - name: BUILD_RUNNER_URL
              value: http://hermes-agent.remediation-pov.svc.cluster.local:8081
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: catalog
              mountPath: /data
            - name: app
              mountPath: /app
            - name: decisions
              mountPath: /decisions
            - name: audit
              mountPath: /audit
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: catalog
          configMap:
            name: stub-findings-catalog
        - name: app
          configMap:
            name: stub-findings-app
            defaultMode: 0755
        - name: decisions
          emptyDir: {}
        - name: audit
          persistentVolumeClaim:
            claimName: stub-audit
