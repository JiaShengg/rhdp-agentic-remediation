kind: Service
metadata:
  name: stub-findings-mcp
  namespace: remediation-pov
  labels:
    app: stub-findings-mcp
    app.kubernetes.io/part-of: remediation-pov
spec:
  selector:
    app: stub-findings-mcp
  ports:
    - name: http
      port: 80
      targetPort: 8080
